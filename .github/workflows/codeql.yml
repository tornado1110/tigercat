name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, off the top of the hour. Runs only after this file is on main.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CodeQL fails the job when a language is selected and the tree has no
      # matching sources. The code skeleton may land after this workflow, so
      # skip analysis until JavaScript or TypeScript is present. Fork pull
      # requests cannot upload code-scanning results; skipping them keeps the
      # check green without using pull_request_target.
      - name: Detect JavaScript or TypeScript
        id: sources
        shell: bash
        run: |
          found=false
          while IFS= read -r file; do
            case "$file" in
              .github/*) continue ;;
              *.js|*.mjs|*.cjs|*.jsx|*.ts|*.tsx|*.mts|*.cts)
                found=true
                break
                ;;
            esac
          done < <(git ls-files)
          echo "found=${found}" >> "$GITHUB_OUTPUT"
          if [ "${found}" != true ]; then
            echo "No JavaScript or TypeScript sources yet; skipping CodeQL."
          fi

      - name: Initialize CodeQL
        if: steps.sources.outputs.found == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        if: steps.sources.outputs.found == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"
