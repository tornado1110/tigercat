name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  # setup-node cache: npm saves the dependency cache through actions/cache.
  actions: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: acp-tck v0.4.0 (win32 killpg teardown is unverified, not a pass)
        id: tck
        run: npm run test:tck
      # Renders acp-tck-result.json. Exits 0 so it does not hide a TCK failure.
      # The previous step's status is still the job's pass/fail gate.
      - name: Write acp-tck verdict to the job summary
        if: always() && steps.tck.outcome != 'skipped'
        run: node scripts/acp-tck-summary.mjs
